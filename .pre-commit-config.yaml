# Pre-commit configuration for DistroIQ
# Prevents common configuration and security issues before they reach git

repos:
  # Built-in pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Python code quality
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings]

  # TypeScript/JavaScript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        files: \.(js|jsx|ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@8.44.0
          - '@typescript-eslint/parser@5.62.0'
          - '@typescript-eslint/eslint-plugin@5.62.0'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0
    hooks:
      - id: prettier
        files: \.(js|jsx|ts|tsx|json|css|md)$

  # Security scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # Custom hooks specific to DistroIQ
  - repo: local
    hooks:
      # Environment file validation
      - id: validate-env-files
        name: Validate Environment Files
        entry: scripts/validate-env-files.sh
        language: script
        files: '\.env.*$'
        pass_filenames: true

      # Backend configuration validation
      - id: validate-backend-config
        name: Validate Backend Configuration
        entry: scripts/validate-backend-config.py
        language: python
        files: 'backend/app/core/config\.py$'
        additional_dependencies: [pydantic, pydantic-settings]

      # Prevent committing secrets
      - id: check-env-secrets
        name: Check for Secrets in .env Files
        entry: scripts/check-env-secrets.sh
        language: script
        files: '\.env.*$'
        pass_filenames: true

      # Validate JWT secrets format
      - id: validate-jwt-secrets
        name: Validate JWT Secret Format
        entry: scripts/validate-jwt-secrets.py
        language: python
        files: '\.env.*$'
        pass_filenames: true

      # TypeScript strict mode check
      - id: typescript-strict-check
        name: Ensure TypeScript Strict Mode
        entry: scripts/check-typescript-strict.py
        language: python
        files: 'tsconfig\.json$'

      # Test that backend can import without errors
      - id: backend-import-test
        name: Backend Import Test
        entry: scripts/test-backend-import.sh
        language: script
        files: 'backend/.*\.py$'
        pass_filenames: false

# Configuration for specific hooks
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false